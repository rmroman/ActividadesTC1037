
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios de repaso</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #eef2ff;
            padding: 50px 20px;
        }

        .contenedor {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 12px #0004;
        }

        input, button {
            padding: 12px;
            margin-top: 12px;
            font-size: 16px;
        }

        input {
            width: 80%;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #resultado {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>Menú de ejercicios</h1>

<ul>
    <li><a href="#calificacion">Ejercicio 1: Calificación escolar</a></li>
    <li><a href="#descanso">Ejercicio 2: Día de descanso</a></li>
</ul>

<div class="contenedor" id="calificacion">
    <h1>Calificación escolar</h1>
    <p>Introduce una calificación entera [1, 100]:</p>

    <input type="number" id="numero"
           step="1" placeholder="Escribe una calificación">
    <br>

    <button onclick="clasificar()">Clasificar calificación</button>

    <p id="resultado"></p>
</div>
<p>&nbsp;</p>
<div class="contenedor" id="descanso">
    <h1>Día de descanso</h1>
    <p>Introduce un número entero [1-lunes, ..., 7-domingo]:</p>

    <input type="number" id="numeroDia"
           step="1" placeholder="Escribe un número">
    <br>

    <button onclick="clasificarDia()">Clasificar día</button>

    <p id="resultadoDia"></p>
</div>

<script>
  function clasificar() {
    let numero = document.getElementById("numero").value;
    let resultado = document.getElementById("resultado");

    if (numero === "" || !Number.isSafeInteger(Number(numero))) {
      resultado.textContent =
        "Introduce una califcación válida.";
    } else {

        resultado.textContent = "Excelente";
      } else if (c>=80 && c<90){
        resultado.textContent = "Muy bien";
      } else if (c>=60 && c<80){
        resultado.textContent = "Aprobado";
      } else if (c<60 && c>=0){
        resultado.textContent = "Reprobado";
      } else {
        resultado.textContent = "Calificación fuera de rango";
      }
    }
  }

  function clasificarDia() {
    let numero = document.getElementById("numeroDia").value;
    let resultado = document.getElementById("resultadoDia");

    if (numero === "" || !Number.isSafeInteger(Number(numero))) {
      resultado.textContent =
        "Introduce un día válido.";
    } else {
      d = Number(numero);
      if (d>=1 && d <= 5) {
        resultado.textContent = "Día entre semana";
      } else if (d>=6 && d<=7){
        resultado.textContent = "Fin de semana";
      } else {
        resultado.textContent = "Día incorrecto.";
      }
    }
  }
</script>
</body>
</html>
